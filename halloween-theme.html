<!--
  BRIDGETON STRONG - HALLOWEEN THEME
  Paste this whole block into a Script Editor web part (same kind the home page already uses).
  Active automatically Oct 25 - Nov 1 (inclusive) in the visitor's local time; does nothing otherwise.

  Testing before Oct 25 (add to the page URL):
     ?halloween=1   force on        ?halloween=0   force off
-->
<style id="bs-halloween-css">
/* Everything below is scoped to html.bs-halloween, which the script only adds inside the date window. */

html.bs-halloween{
  --hw-orange:#ff7a18; --hw-orange-deep:#c2410c; --hw-orange-soft:#ffb347;
  --hw-purple:#7b2cbf; --hw-purple-deep:#2a0a4a; --hw-ink:#f6eefc; --hw-panel:#120a1c; --hw-line:#3a2457;
  --hw-grad:linear-gradient(90deg,var(--hw-orange),var(--hw-purple));
  --hw-grad-diag:linear-gradient(135deg,var(--hw-orange),var(--hw-purple));

  /* SharePoint's own theme variables: recolors anything that uses the site theme (blue -> orange) */
  --themePrimary:#ff7a18; --themeDarkAlt:#e8680c; --themeDark:#c2410c; --themeDarker:#9a3412;
  --themeSecondary:#ff8f3a; --themeTertiary:#ffb347; --themeLight:#3a2457; --themeLighter:#2a0a4a; --themeLighterAlt:#120a1c;
  --bodyBackground:#000; --bodyText:#f6eefc; --bodySubtext:#cdb8e6;
}

/* ---------- Page background: black ---------- */
html.bs-halloween,
html.bs-halloween body,
html.bs-halloween #spPageChromeAppDiv,
html.bs-halloween #spPageCanvasContent,
html.bs-halloween [data-automation-id="contentScrollRegion"],
html.bs-halloween [data-automation-id="pageContent"],
html.bs-halloween .CanvasComponent,
html.bs-halloween [class*="CanvasZone"],
html.bs-halloween [class*="CanvasSection"],
html.bs-halloween [class*="sectionContainer"]{
  background:#000 !important; background-image:none !important; color:var(--hw-ink);
}
html.bs-halloween [class*="sectionContainer"]::before,
html.bs-halloween [class*="sectionContainer"]::after{background:none !important}

/* ---------- Text ---------- */
html.bs-halloween h1,html.bs-halloween h2,html.bs-halloween h3,html.bs-halloween h4,
html.bs-halloween [data-automation-id="webPartHeader"],
html.bs-halloween [class*="webPartHeader"]{color:var(--hw-orange-soft) !important}
html.bs-halloween p,html.bs-halloween li,html.bs-halloween span,html.bs-halloween label{color:inherit}
html.bs-halloween a{color:var(--hw-orange-soft)}
html.bs-halloween a:hover{color:#fff}

/* ---------- Site header / suite bar ---------- */
html.bs-halloween [aria-label="SharePoint Site Header"],
html.bs-halloween #spSiteHeader,
html.bs-halloween #O365_NavHeader,
html.bs-halloween #SuiteNavWrapper,
html.bs-halloween [data-automation-id="SiteHeader"]{
  background:linear-gradient(90deg,#000 0%,var(--hw-purple-deep) 55%,var(--hw-orange-deep) 100%) !important;
  border-bottom:2px solid var(--hw-orange) !important;
}
html.bs-halloween .SiteHeaderTitleMinimal,
html.bs-halloween [class*="SiteHeaderTitle"]{
  font-family:"Creepster","Chiller",fantasy !important; letter-spacing:.04em;
  color:var(--hw-orange) !important; text-shadow:0 0 14px rgba(255,122,24,.65);
}

/* ---------- Tabs ---------- */
html.bs-halloween .addui-Tabs-tab{color:var(--hw-ink) !important; background:var(--hw-panel) !important; border-color:var(--hw-line) !important}
html.bs-halloween .addui-Tabs-tab.addui-Tabs-active{
  background:var(--hw-grad) !important; color:#fff !important; border-color:var(--hw-orange) !important;
  box-shadow:0 0 14px rgba(255,122,24,.45);
}

/* ---------- Blue borders / dividers -> orange-to-purple ---------- */
html.bs-halloween div [class^="n_io"],
html.bs-halloween [class*="sectionContainer"] > div,
html.bs-halloween .overlayContainer-528,
html.bs-halloween #overlayContainer-528{
  border-color:var(--hw-orange) !important;
}

/* ---------- Quick links / button cards ----------
   Only the tile (border, background, glow) is themed. Icon images/SVGs are left exactly as they are. */
html.bs-halloween .ButtonCard,
html.bs-halloween #ButtonCard,
html.bs-halloween [class*="ButtonCard"],
html.bs-halloween .buttoncard,
html.bs-halloween [data-automation-id="button-card"],
html.bs-halloween .root-103,
html.bs-halloween #button_webpart{
  background:linear-gradient(var(--hw-panel),var(--hw-panel)) padding-box,var(--hw-grad) border-box !important;
  border:2px solid transparent !important; border-radius:10px; color:var(--hw-ink) !important;
  box-shadow:none !important; transition:transform .15s ease, box-shadow .15s ease;
}
html.bs-halloween .ButtonCard:hover,
html.bs-halloween [class*="ButtonCard"]:hover,
html.bs-halloween .buttoncard:hover,
html.bs-halloween [data-automation-id="button-card"]:hover{
  transform:translateY(-2px); box-shadow:0 0 16px rgba(255,122,24,.5) !important;
}
html.bs-halloween .ButtonCard *:not(img):not(svg):not(svg *),
html.bs-halloween [class*="ButtonCard"] *:not(img):not(svg):not(svg *),
html.bs-halloween [data-automation-id="button-card"] *:not(img):not(svg):not(svg *){color:var(--hw-ink) !important}
/* belt and braces: never filter/recolor the icons */
html.bs-halloween [class*="ButtonCard"] img,
html.bs-halloween [data-automation-id="button-card"] img,
html.bs-halloween .buttoncard img{filter:none !important; mix-blend-mode:normal !important; opacity:1 !important}

/* ---------- News, captions, command bars ---------- */
html.bs-halloween #carouselItemWrapper,
html.bs-halloween [automation-id="newsItem"],
html.bs-halloween [data-automation-id="newsItem"]{border-color:var(--hw-orange) !important; background-color:var(--hw-panel) !important}
html.bs-halloween .CaptionElementView,
html.bs-halloween .nil{background:linear-gradient(180deg,rgba(42,10,74,.85),rgba(194,65,12,.9)) !important; color:#fff !important}
html.bs-halloween div[role=menubar],
html.bs-halloween .commandBarButtonHeightAndColor{background:var(--hw-panel) !important; color:var(--hw-orange-soft) !important}

/* ---------- Your custom gradient / frame web parts ---------- */
html.bs-halloween #gradA,
html.bs-halloween #grad9,
html.bs-halloween .taierframe .grador,
html.bs-halloween .innergrad,
html.bs-halloween [class^="bst-ai"],
html.bs-halloween [class*=" bst-ai"]{
  background:linear-gradient(var(--hw-panel),var(--hw-panel)) padding-box,var(--hw-grad) border-box !important;
  border-color:transparent !important; box-shadow:0 0 18px rgba(123,44,191,.35) !important;
}
html.bs-halloween .gradient-text0{
  background:var(--hw-grad) !important; -webkit-background-clip:text !important; background-clip:text !important;
  -webkit-text-fill-color:transparent !important; color:transparent !important;
}
/* flu card: swap the green glow for orange (keeps its own shimmer animation) */
html.bs-halloween [id="f689d78c-6877-4ada-8172-90456fb047c2"]{
  border-color:var(--hw-orange) !important; box-shadow:0 0 22px rgba(255,122,24,.55) !important;
}

/* ---------- Spooky critters layer ---------- */
#bs-hw-layer{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:2147483000}
#bs-hw-layer svg{position:absolute;left:0;top:0;will-change:transform;pointer-events:auto;cursor:pointer;-webkit-tap-highlight-color:transparent}
#bs-hw-layer .bs-smoke{position:absolute;border-radius:50%;pointer-events:none;will-change:transform,opacity,filter}
#bs-hw-layer .bs-wing{transform-origin:32px 14px;animation:bs-flap .22s ease-in-out infinite alternate}
@keyframes bs-flap{from{transform:scaleY(1)}to{transform:scaleY(.35)}}
@media (prefers-reduced-motion:reduce){#bs-hw-layer .bs-wing{animation:none}}
</style>

<script id="bs-halloween-js">
(function(){
  'use strict';
  if(window.__bsHalloween) return; window.__bsHalloween=true;   // guard against double-loading

  /* ===== Date gate: Oct 25 through Nov 1 inclusive, visitor's local time ===== */
  function inWindow(dt){var m=dt.getMonth(), d=dt.getDate(); return (m===9&&d>=25)||(m===10&&d===1);}
  var qs=(location.search.match(/[?&]halloween=([01])/)||[])[1];
  var active = qs==='1' ? true : qs==='0' ? false : inWindow(new Date());
  if(!active) return;

  var root=document.documentElement;
  root.classList.add('bs-halloween');

  /* Spooky title font (falls back to Chiller/fantasy if blocked) */
  try{
    var f=document.createElement('link'); f.rel='stylesheet';
    f.href='https://fonts.googleapis.com/css2?family=Creepster&display=swap';
    document.head.appendChild(f);
  }catch(e){}

  /* ===== Critters ===== */
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  var FREQ=1;   // 0.5 = rarer, 2 = busier. Base is one critter every ~14-26 seconds.
  var layer=document.createElement('div'); layer.id='bs-hw-layer'; layer.setAttribute('aria-hidden','true');
  document.body.appendChild(layer);

  var W=function(){return window.innerWidth}, H=function(){return window.innerHeight};
  function rnd(a,b){return a+Math.random()*(b-a)}
  function mk(html,w,h){
    var s=document.createElementNS('http://www.w3.org/2000/svg','svg');
    s.setAttribute('viewBox','0 0 '+w+' '+h); s.setAttribute('width',w); s.setAttribute('height',h);
    s.innerHTML=html; layer.appendChild(s); return s;
  }

  /* Click/tap a critter: it vanishes in a puff of eerie smoke */
  var SMOKE=['rgba(190,150,255,.55)','rgba(140,90,210,.5)','rgba(235,225,250,.4)','rgba(255,150,60,.35)'];
  function gone(n){return function(){n.remove()}}
  function poof(el,anim){
    var r=el.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2, size=Math.max(r.width,r.height);
    anim.pause(); el.style.pointerEvents='none';
    el.animate([{opacity:1,filter:'blur(0px)',scale:1},{opacity:0,filter:'blur(8px)',scale:1.35}],
      {duration:380,easing:'ease-out',fill:'forwards'}).onfinish=gone(el);
    if(reduce) return;
    for(var i=0;i<9;i++){
      var d=document.createElement('div'), sz=size*rnd(.45,.8), a=Math.random()*Math.PI*2, dist=rnd(.3,.9)*size;
      d.className='bs-smoke';
      d.style.cssText='width:'+sz+'px;height:'+sz+'px;left:'+(cx-sz/2)+'px;top:'+(cy-sz/2)+'px;background:radial-gradient(circle,'+SMOKE[Math.floor(Math.random()*SMOKE.length)]+' 0%,rgba(80,40,140,0) 70%)';
      layer.appendChild(d);
      var x=Math.cos(a)*dist, y=Math.sin(a)*dist-rnd(20,70);
      d.animate([
        {transform:'translate(0,0) scale(.3)',opacity:0,filter:'blur(2px)'},
        {transform:'translate('+x*.5+'px,'+y*.5+'px) scale(1)',opacity:1,filter:'blur(5px)',offset:.3},
        {transform:'translate('+x+'px,'+y+'px) scale(1.9)',opacity:0,filter:'blur(14px)'}
      ],{duration:rnd(900,1400),easing:'ease-out',delay:rnd(0,120)}).onfinish=gone(d);
    }
    for(var j=0;j<6;j++){
      var sp=document.createElement('div'), a2=Math.random()*Math.PI*2, ds=rnd(.6,1.3)*size;
      sp.className='bs-smoke';
      sp.style.cssText='width:5px;height:5px;left:'+(cx-2)+'px;top:'+(cy-2)+'px;background:#ffb347;box-shadow:0 0 8px #ff7a18';
      layer.appendChild(sp);
      sp.animate([{transform:'translate(0,0)',opacity:1},{transform:'translate('+Math.cos(a2)*ds+'px,'+(Math.sin(a2)*ds-30)+'px)',opacity:0}],
        {duration:rnd(500,900),easing:'ease-out'}).onfinish=gone(sp);
    }
  }
  function done(el,anim){
    anim.onfinish=gone(el);
    el.addEventListener('pointerdown',function(e){e.preventDefault();poof(el,anim)},{once:true});
  }

  function bat(){
    var sc=rnd(.8,1.5), el=mk(
      '<g fill="#14001f" stroke="#9d4edd" stroke-width="1.2">'+
      '<path class="bs-wing" d="M32 14 C26 2 12 2 0 10 C8 10 10 16 14 20 C18 16 24 18 32 22Z"/>'+
      '<path class="bs-wing" d="M32 14 C38 2 52 2 64 10 C56 10 54 16 50 20 C46 16 40 18 32 22Z"/>'+
      '<ellipse cx="32" cy="17" rx="5" ry="8"/><path d="M28 10 L29 4 L32 9 L35 4 L36 10Z"/></g>'+
      '<circle cx="30" cy="14" r="1.2" fill="#ff7a18"/><circle cx="34" cy="14" r="1.2" fill="#ff7a18"/>',64,32);
    el.style.width=64*sc+'px'; el.style.height=32*sc+'px';
    var ltr=Math.random()<.5, y0=rnd(80,H()*.7), y1=y0+rnd(-160,160), dur=rnd(5500,8500);
    var x0=ltr?-100:W()+100, x1=ltr?W()+100:-100, mid=(x0+x1)/2, fl='scaleX('+(ltr?1:-1)+')';
    done(el,el.animate([
      {transform:'translate('+x0+'px,'+y0+'px) '+fl},
      {transform:'translate('+(x0+(mid-x0)*.5)+'px,'+(y0+(y1-y0)*.5-60)+'px) '+fl,offset:.3},
      {transform:'translate('+mid+'px,'+(y0+(y1-y0)*.5+50)+'px) '+fl,offset:.6},
      {transform:'translate('+x1+'px,'+y1+'px) '+fl}
    ],{duration:dur,easing:'linear'}));
  }

  function ghost(){
    var sc=rnd(.9,1.6), el=mk(
      '<path d="M4 46V20a16 16 0 0 1 32 0v26l-5.3-4-5.4 4-5.3-4-5.3 4-5.4-4z" fill="#f6eefc" fill-opacity=".88"/>'+
      '<ellipse cx="14" cy="20" rx="2.6" ry="3.6" fill="#1a0b2e"/><ellipse cx="26" cy="20" rx="2.6" ry="3.6" fill="#1a0b2e"/>'+
      '<ellipse cx="20" cy="30" rx="3" ry="4" fill="#1a0b2e"/>',40,48);
    el.style.width=40*sc+'px'; el.style.height=48*sc+'px';
    el.style.filter='drop-shadow(0 0 10px rgba(180,120,255,.7))';
    var ltr=Math.random()<.5, base=rnd(100,H()*.65), dur=rnd(9000,14000), n=8, fr=[];
    for(var i=0;i<=n;i++){
      var t=i/n, x=ltr?-80+(W()+160)*t:W()+80-(W()+160)*t;
      fr.push({transform:'translate('+x+'px,'+(base+Math.sin(t*Math.PI*3)*45)+'px)',opacity:(i===0||i===n)?0:.85});
    }
    done(el,el.animate(fr,{duration:dur,easing:'linear'}));
  }

  function spider(){
    var sc=rnd(.9,1.4), len=rnd(120,Math.min(380,H()*.55)), x=rnd(40,Math.max(60,W()-80)), legs='';
    for(var i=0;i<4;i++){var a=6+i*7;
      legs+='<path d="M20 '+(len+14)+' q-12 '+(-14+i*4)+' -17 '+(a-10)+' M20 '+(len+14)+' q12 '+(-14+i*4)+' 17 '+(a-10)+'" fill="none" stroke="#14001f" stroke-width="2"/>';}
    var el=mk('<line x1="20" y1="0" x2="20" y2="'+(len+8)+'" stroke="#c9b5e6" stroke-width="1"/>'+legs+
      '<circle cx="20" cy="'+(len+16)+'" r="9" fill="#14001f" stroke="#9d4edd" stroke-width="1.2"/>'+
      '<circle cx="20" cy="'+(len+10)+'" r="5" fill="#14001f" stroke="#9d4edd" stroke-width="1.2"/>'+
      '<circle cx="18" cy="'+(len+9)+'" r="1.2" fill="#ff7a18"/><circle cx="22" cy="'+(len+9)+'" r="1.2" fill="#ff7a18"/>',40,len+40);
    el.style.width=40*sc+'px'; el.style.height=(len+40)*sc+'px';
    var top='translate('+x+'px,'+(-(len+40)*sc)+'px)', low='translate('+x+'px,0px)';
    done(el,el.animate([{transform:top},{transform:low,offset:.25,easing:'ease-out'},
      {transform:'translate('+x+'px,-14px)',offset:.45},{transform:low,offset:.65},
      {transform:low,offset:.8},{transform:top}],{duration:7000,easing:'ease-in-out'}));
  }

  var kinds=[ghost,bat,spider];
  function auto(){
    if(!reduce&&!document.hidden) kinds[Math.floor(Math.random()*3)]();
    setTimeout(auto,rnd(9000,16000)/FREQ*1.6);
  }
  if(!reduce){
    setTimeout(bat,1500);
    setTimeout(ghost,4000);
    setTimeout(auto,9000);
  }
})();
</script>
